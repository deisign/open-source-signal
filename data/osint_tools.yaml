  review_summary_en: ShadowFinder is a lightweight Bellingcat tool and notebook that estimates where on Earth a
    particular shadow geometry could occur. A researcher supplies a date and time plus either an object's height
    and shadow length or the sun's altitude angle. The result is plotted as a band of possible locations. The project
    can run in Google Colab, a local Jupyter environment, through a Python library or through a command-line interface;
    the repository notes that the command-line route is slower because its time-zone grid is regenerated without
    caching.
  review_workflow_en: Preserve the original image and its provenance first. Record the assumed capture time and
    whether it is local or UTC, object selected for measurement, basis for its height, shadow start and endpoint,
    perspective correction, measured ratio and all uncertainty ranges. Save the ShadowFinder version, inputs and
    output image. Intersect the result with independent clues such as language, road layout, architecture, terrain,
    vegetation, weather, satellite imagery and historical street-level material. Rerun the calculation using plausible
    upper and lower measurement bounds.
  review_summary_uk: ShadowFinder — легкий інструмент і записник Bellingcat, який оцінює, де на Землі могла виникнути
    певна геометрія тіні. Дослідник задає дату й час, а також або висоту об’єкта та довжину тіні, або висоту Сонця
    над горизонтом. Результат показується як смуга можливих місць. Проєкт можна запускати в Google Colab, локальному
    середовищі Jupyter, як бібліотеку Python або з командного рядка; у сховищі зазначено, що останній спосіб повільніший
    через повторне створення часової сітки.
  review_workflow_uk: 'Спочатку збережіть первинне зображення та його походження. Фіксуйте припущений час знімання
    й те, чи він місцевий або UTC, обраний для вимірювання об’єкт, підставу для його висоти, початок і кінець тіні,
    поправку на перспективу, виміряне співвідношення та межі невизначеності. Збережіть версію ShadowFinder, вхідні
    значення й отримане зображення. Перетинайте результат із незалежними ознаками: мовою, плануванням доріг, архітектурою,
    рельєфом, рослинністю, погодою, супутниковими знімками та історичними наземними матеріалами. Повторюйте розрахунок
    для правдоподібних нижньої й верхньої меж вимірювань.'

  review_summary_en: OCRmyPDF is an open-source command-line tool that adds an OCR text layer to scanned PDF files
    so their contents can be searched and copied while retaining the PDF page images. Its documentation covers language
    packs, image processing, OCR redo and PDF optimisation. The project's security guidance explicitly says OCRmyPDF
    should only be used on PDFs you trust and is not designed to protect against malicious PDFs.
  review_workflow_en: Run OCR on a preserved working copy, select the correct language packs, retain the original
    file hash and source, then use OCR text for discovery and indexing. For quotations, names, dates and numbers,
    verify the hit against the scanned page. Isolate untrusted PDFs before processing them.
  review_summary_uk: 'OCRmyPDF — інструмент із відкритим кодом для командного рядка, який додає до сканованого PDF
    текстовий шар розпізнавання, щоб документ можна було шукати й копіювати, зберігаючи зображення сторінок. Документація
    охоплює мовні пакети, обробку зображень, повторне розпізнавання та оптимізацію PDF. У настановах із безпеки
    проєкт прямо зазначає: OCRmyPDF слід застосовувати лише до файлів, яким ви довіряєте; він не призначений для
    захисту від шкідливих PDF.'
  review_workflow_uk: Запускайте розпізнавання на збереженій робочій копії, вибирайте правильні мовні пакети, фіксуйте
    хеш і джерело оригінального файла, а розпізнаний текст використовуйте для пошуку та індексації. Цитати, імена,
    дати й числа перевіряйте за зображенням сторінки. Недовірені PDF перед обробкою ізолюйте.

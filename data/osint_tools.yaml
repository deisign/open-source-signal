  archive_review: true
  review_summary_en: Project Salt Box tracks warehouses and other properties considered, purchased, cancelled or
    still pending for conversion into United States immigration-detention facilities. Its work combines property
    records, government contract information, procurement documents, local planning and reporting, and maintains
    changing status categories rather than presenting the original leaked target list as permanent fact. The project
    also publishes a DHS contracts visualiser and explanatory reporting that shows how an infrastructure lead moves
    through acquisition, cancellation, proposed use and local response.
  review_workflow_en: Create one property record with parcel identifier, address generalised for publication where
    necessary, owner, seller, buyer, broker and corporate identifiers. Store each status transition separately with
    date, source document, contract or deed number, amount, intended capacity, planning record, cancellation evidence,
    site imagery date, local response and reviewer. Archive the source documents and map snapshots. Use a controlled
    vocabulary such as lead, proposed, under negotiation, acquired, cancelled, construction observed, opened and
    closed, and never overwrite earlier states.
  review_summary_uk: Project Salt Box відстежує склади та іншу нерухомість, які розглядали, придбали, скасували
    або ще планують переобладнати під установи імміграційного утримання у США. Проєкт поєднує майнові реєстри, державні
    договори, закупівельні документи, місцеве планування й журналістські матеріали та підтримує змінні категорії
    стану, а не подає первинний витік переліку як незмінний факт. Окремо оприлюднено візуалізацію договорів DHS
    і пояснювальні матеріали, що показують перехід інфраструктурної зачіпки через придбання, скасування, заявлене
    призначення й місцеву реакцію.
  review_workflow_uk: 'Створіть окремий запис про нерухомість із кадастровим ідентифікатором, узагальненою для публікації
    адресою за потреби, власником, продавцем, покупцем, посередником і корпоративними ідентифікаторами. Кожний перехід
    стану фіксуйте окремо з датою, документом-джерелом, номером договору чи правочину, сумою, заявленою місткістю,
    планувальним записом, доказом скасування, датою знімка місця, місцевою реакцією й перевіряльником. Архівуйте
    документи та знімки карти. Використовуйте контрольований перелік станів: зачіпка, запропоновано, переговори,
    придбано, скасовано, помічено будівництво, відкрито, закрито — і не перезаписуйте попередні.'

  archive_review: true
  review_summary_en: 'Open Measures provides a public research platform for searching and analysing text and multimedia
    collected from multiple online sources. Its public tools expose standardized content fields, search, activity
    analysis and a public API. The public tier is deliberately constrained: its documentation states that access
    is rate-limited to 39 requests per day and visible content is at least six months old. More extensive access
    is handled separately.'
  review_workflow_en: Define the research question before searching. Preserve the exact query, selected sources,
    date range, returned identifiers, original post URLs where available, collection timestamps and exported results.
    When comparing platforms, normalize time zones and distinguish platform-native fields from Open Measures' standardized
    representation. Archive decisive source material independently before publication.
  review_summary_uk: 'Open Measures надає публічну дослідницьку платформу для пошуку й аналізу текстового та мультимедійного
    вмісту, зібраного з різних онлайн-джерел. Відкриті засоби використовують стандартизовані поля, пошук, аналіз
    активності та публічний програмний інтерфейс. Відкритий рівень навмисно обмежений: документація вказує на 39
    запитів на добу, а видимий вміст має бути щонайменше шестимісячної давнини. Розширений доступ надається окремо.'
  review_workflow_uk: Сформулюйте дослідницьке питання до початку пошуку. Зберігайте точний запит, обрані джерела,
    часовий проміжок, отримані ідентифікатори, первинні посилання на публікації за наявності, час збирання та вивантажені
    результати. Порівнюючи платформи, уніфікуйте часові пояси й відділяйте первинні поля сервісу від стандартизованого
    подання Open Measures. Вирішальні матеріали перед публікацією зберігайте незалежно.

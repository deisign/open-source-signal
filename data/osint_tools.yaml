  review_summary_en: 'The Illicit Finance Data Lab is a joint initiative of the Anti-Corruption Data Collective
    and OCCRP that connects investigative journalists, academic researchers and data scientists. It publishes guidance,
    tip sheets and case studies on dataset triage, processing differences, cryptocurrency and interdisciplinary
    collaboration, while providing invitation-based access to discussion and project exchange. The project responds
    to a recurring problem: relevant leaks, public disclosures and commercial datasets exist, but newsrooms often
    lack the processing capacity, domain expertise or time to use them safely and rigorously.'
  review_workflow_en: Before sharing data, write a project charter covering purpose, legal basis, source restrictions,
    access roles, storage location, encryption, retention, publication authority, embargo, review rights, credit
    and exit conditions. Create a dataset triage sheet with provenance, licence, affected people, unique identifiers,
    missingness, likely bias, computation cost and expected public-interest value. Version every transformed table
    and analysis notebook. For each published claim, link the underlying query, reviewer, legal check, subject response
    and correction path.
  review_summary_uk: 'Illicit Finance Data Lab — спільна ініціатива Anti-Corruption Data Collective та OCCRP, що
    поєднує журналістів-розслідувачів, академічних дослідників і фахівців з даних. Вона публікує настанови, короткі
    поради й розбори щодо первинного оцінювання масивів, відмінностей в опрацюванні, криптоактивів та міждисциплінарної
    співпраці, а також надає доступ за запрошенням до обговорень і обміну проєктами. Проєкт відповідає на повторювану
    проблему: витоки, відкриті подання й комерційні масиви існують, але редакціям часто бракує обчислювальних можливостей,
    предметної компетентності або часу для безпечної й суворої роботи.'
  review_workflow_uk: До передавання даних укладіть статут проєкту з метою, правовою підставою, обмеженнями джерела,
    ролями доступу, місцем зберігання, шифруванням, строком збереження, правом на публікацію, ембарго, правами перевірки,
    авторством та умовами виходу. Створіть аркуш первинного оцінювання масиву з походженням, ліцензією, зачепленими
    людьми, унікальними ідентифікаторами, пропусками, можливими упередженнями, вартістю опрацювання й очікуваною
    суспільною цінністю. Версіонуйте кожну перетворену таблицю й аналітичний зошит. Кожне оприлюднене твердження
    пов’язуйте з первинним запитом, перевіряльником, правовою перевіркою, відповіддю суб’єкта та шляхом виправлення.

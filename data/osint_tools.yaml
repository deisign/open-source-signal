  archive_review: true
  review_summary_en: Tools of War is an investigative platform for exploring customs and procurement records connected
    with machine tools and other sensitive equipment shipped to Russia. It geolocates exporters and importers, links
    shipment records with sanctions and Russian public data, and applies an automated probability score for possible
    dual-use relevance. The project and GIJN describe an interactive map, raw shipment fields and reverse searches
    from Russian military-linked companies toward Western suppliers. Access for journalists is requested through
    the project, while guides explain how to validate company tax numbers, addresses, procurement records and military-industry
    connections.
  review_workflow_en: Export the raw shipment rows and record the platform version, filters and score threshold.
    Resolve every company with registration number, tax number, address history and aliases. Preserve product description,
    tariff code, date, value, weight, shipper, consignee, intermediary and country. Check the applicable sanctions
    and export-control text as of the shipment date, technical specifications, licence requirements, end-user evidence,
    Russian procurement and factory records, company response and alternative civilian use. Publish the score as
    a lead attribute, not as proof.
  review_summary_uk: Tools of War — дослідницька платформа для вивчення митних і закупівельних записів щодо верстатів
    та іншого чутливого обладнання, поставленого до Росії. Вона геолокує експортерів та імпортерів, поєднує записи
    про поставки із санкціями й російськими відкритими даними та застосовує автоматизовану оцінку ймовірного подвійного
    призначення. Проєкт і GIJN описують інтерактивну карту, первинні поля вантажів та зворотний пошук від російських
    компаній, пов’язаних із військовою промисловістю, до західних постачальників. Журналісти запитують доступ у
    команди проєкту, а настанови пояснюють перевірку податкових номерів, адрес, закупівель і зв’язків із військово-промисловим
    комплексом.
  review_workflow_uk: Вивантажуйте первинні рядки поставок і фіксуйте версію платформи, умови відбору та поріг оцінки.
    Встановлюйте кожну компанію за реєстраційним і податковим номером, історією адрес та варіантами назв. Зберігайте
    опис товару, митний код, дату, вартість, вагу, відправника, одержувача, посередника й країну. Перевіряйте санкційні
    та експортні норми на дату поставки, технічні характеристики, потребу в дозволі, докази кінцевого користувача,
    російські закупівлі й записи підприємства, відповідь компанії та можливе цивільне застосування. Публікуйте оцінку
    як властивість зачіпки, а не як доказ.

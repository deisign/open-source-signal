  review_summary_en: 404 Media reported confirmed law-enforcement purchases and pilots of GeoSpy, an AI tool that
    claims to infer location from images. The report is not Ukraine-specific, but it matters for OSINT because AI-assisted
    geolocation is moving from community experimentation into policing and institutional investigative workflows.
  review_workflow_en: 'Use AI geolocation only as a lead generator. Any suggested location should be verified through
    classic methods: visual landmarks, terrain, shadows, road geometry, vegetation, architecture, metadata where
    lawfully available, satellite imagery and independent source comparison.'
  review_summary_uk: 404 Media повідомило про підтверджені закупівлі та пілоти GeoSpy — AI-інструмента, який заявляє
    здатність визначати місце зйомки за зображенням. Матеріал не про Україну напряму, але важливий для OSINT, бо
    AI-геолокація переходить від експериментів спільноти до поліцейських та інституційних практик.
  review_workflow_uk: 'AI-геолокацію слід використовувати тільки як генератор версій. Кожну запропоновану локацію
    треба перевіряти класичними методами: орієнтири, рельєф, тіні, дорожня геометрія, рослинність, архітектура,
    метадані там, де це законно, супутникові знімки та незалежні джерела.'

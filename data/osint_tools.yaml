  review_summary_en: HeiGIT's ohsome platform provides history statistics and quality analysis for OpenStreetMap.
    The public dashboard can query selected areas, tags and object types over time, compare regions, measure counts
    or lengths and export analytical results as CSV or JSON. The underlying ohsome API supports time-specific extraction
    and historical OpenStreetMap information. At the time of review, the dashboard reported frontend version 1.9.0
    and ohsome API version 1.10.4.
  review_workflow_en: Save the area of interest, exact tag or filter, object type, measure, time interval, grouping,
    dashboard or API version, query permalink where available, retrieval time and exported file with a hash. For
    a feature-level investigation preserve the OpenStreetMap object identifier, versions, relevant changesets and
    a before/after geometry or tag comparison. Corroborate the suspected real-world change with imagery, official
    records, local reporting, archived pages or other independent evidence.
  review_summary_uk: Платформа ohsome від HeiGIT надає історичну статистику та оцінювання якості OpenStreetMap.
    Відкрита панель дає змогу задавати ділянку, теги й типи об’єктів, порівнювати території в часі, рахувати об’єкти
    або довжини та вивантажувати результати аналізу в CSV чи JSON. Базовий інтерфейс ohsome API підтримує вибірки
    на визначений момент і роботу з історичними відомостями OpenStreetMap. Під час перевірки панель указувала версію
    1.9.0, а ohsome API — 1.10.4.
  review_workflow_uk: Зберігайте ділянку дослідження, точний тег або умову, тип об’єкта, показник, часовий проміжок,
    спосіб групування, версію панелі чи API, постійне посилання на запит за наявності, час отримання та вивантажений
    файл із контрольною сумою. Для окремого об’єкта фіксуйте його ідентифікатор OpenStreetMap, версії, пов’язані
    набори змін і порівняння геометрії чи тегів до та після. Ймовірну зміну на місцевості підтверджуйте знімками,
    офіційними записами, місцевими повідомленнями, архівними сторінками або іншими незалежними доказами.

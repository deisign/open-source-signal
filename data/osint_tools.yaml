  review_summary_en: ASF Data Search provides Vertex, a graphical interface for finding synthetic-aperture-radar
    data in NASA-hosted collections, including Sentinel-1 and NISAR holdings. Searches can be constrained by geography,
    date and product properties. Eligible scenes can also be submitted through ASF's HyP3 service for higher-level
    products such as radiometric terrain correction or interferometric SAR. A free NASA Earthdata Login is required
    for data download and authenticated functions.
  review_workflow_en: Define an area of interest, constrain the acquisition window, inspect orbit direction, product
    type and scene metadata, then export the search or download the selected products. For change analysis, compare
    acquisitions with compatible geometry and processing. Preserve product identifiers and processing level in the
    case record.
  review_summary_uk: ASF Data Search надає Vertex — графічний інтерфейс для пошуку даних радарів із синтезованою
    апертурою у фондах NASA, зокрема Sentinel-1 і NISAR. Пошук можна обмежувати географією, датою та властивостями
    продукту. Для придатних сцен через сервіс HyP3 можна замовляти похідні продукти, зокрема радіометричну корекцію
    рельєфу або інтерферометричну обробку. Для завантаження даних і функцій з автентифікацією потрібен безкоштовний
    обліковий запис NASA Earthdata.
  review_workflow_uk: Визначте ділянку інтересу, обмежте часовий проміжок знімання, перевірте напрям орбіти, тип
    продукту й метадані сцени, після чого експортуйте пошук або завантажте вибрані продукти. Для аналізу змін порівнюйте
    знімання із сумісною геометрією та обробкою. У матеріалах справи зберігайте ідентифікатори продуктів і рівень
    обробки.

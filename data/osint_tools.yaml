  review_summary_en: Bellingcat’s Iran Conflict Damage Proxy Map applies a Pixel-Wise T-Test algorithm to open Sentinel-1
    synthetic-aperture-radar imagery. For each pixel, the method builds a historical pre-war backscatter range and
    flags locations whose post-war observations fall consistently outside that baseline. The map is designed to
    highlight candidate areas of damage in Iran and the Gulf when optical or commercial imagery is sparse, and Bellingcat
    recommends cross-checking candidates with Sentinel-2, geolocated media or other imagery.
  review_workflow_en: Use the proxy map to shortlist areas, then record the pixel or site, anomaly date range and
    historical baseline. Cross-check with pre- and post-event optical imagery, geolocated photos or video, official
    damage reports and alternative SAR dates. Preserve the distinction between algorithmic probability, visually
    confirmed physical damage, object identity, incident date and perpetrator attribution.
  review_summary_uk: Iran Conflict Damage Proxy Map від Bellingcat застосовує алгоритм Pixel-Wise T-Test до відкритих
    радарних знімків Sentinel-1. Для кожного пікселя метод формує історичний довоєнний діапазон зворотного розсіювання
    й позначає місця, де після початку війни спостереження стабільно виходять за цей базовий рівень. Карта призначена
    для первинного виявлення можливих зон руйнувань в Ірані та країнах Перської затоки, коли оптичних або комерційних
    знімків бракує; Bellingcat радить перевіряти кандидати за Sentinel-2, геолокованими матеріалами чи іншими зображеннями.
  review_workflow_uk: Використовуйте карту для створення переліку кандидатів, а потім фіксуйте ділянку, часовий
    проміжок аномалії та історичний базовий рівень. Звіряйте результат з оптичними знімками до і після події, геолокованими
    фото чи відео, офіційними повідомленнями про пошкодження та іншими датами радарного знімання. Відділяйте алгоритмічну
    ймовірність, візуально підтверджене фізичне пошкодження, ідентичність об’єкта, дату події та встановлення виконавця.

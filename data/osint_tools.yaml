  archive_review: true
  review_summary_en: Waypoint is a Windows desktop tool that estimates where an outdoor photo was taken. Its pipeline
    starts with coarse PLONK localization, checks sun and season plausibility, compares candidates against Mapillary,
    Google Street View and Panoramax imagery, then applies local-feature matching with DISK and LightGlue. The application
    exposes confidence, uncertainty and evidence per candidate. Most inference runs locally; imagery lookups are
    the main networked step.
  review_workflow_en: Use the result as a candidate list. Preserve the candidate score, imagery source, visual match
    and sun-plausibility result, then corroborate with independent landmarks, maps, terrain or other dated imagery
    before publishing a location claim.
  review_summary_uk: Waypoint — Windows desktop-інструмент, що оцінює місце зйомки зовнішньої фотографії. Pipeline
    починається з грубої локалізації PLONK, перевіряє правдоподібність сонця й сезону, порівнює кандидатів із зображеннями
    Mapillary, Google Street View і Panoramax, а потім застосовує локальне зіставлення ознак DISK і LightGlue. Інтерфейс
    показує confidence, uncertainty та evidence для кожного кандидата. Більшість inference виконується локально;
    мережевими є насамперед запити до imagery.
  review_workflow_uk: Використовуйте результат як список кандидатів. Зберігайте score кандидата, джерело imagery,
    візуальний match і результат sun-plausibility, а перед публікацією геолокації підтверджуйте її незалежними орієнтирами,
    картами, рельєфом чи іншими датованими зображеннями.

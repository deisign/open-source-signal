    and creates page captures that can be tagged, searched and assembled into reports. The product is designed around
    a browser-based audit trail rather than relying on researchers to remember which screenshots to save after the
    fact.
  review_workflow_en: Create a case before browsing, keep capture enabled only for the relevant research session,
    tag decisive pages, export the report and preserve the underlying case data. For high-value evidence, independently
    archive the decisive source and record any login or personalization context that could affect what was displayed.
  review_summary_uk: Hunchly автоматично фіксує URL, часову мітку й контрольну суму сторінок, відкритих під час

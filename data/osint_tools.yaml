    what should never be collected, how the device is locked, where encrypted material is transferred and who can
    access it. Test the exact phone and transfer path with non-sensitive material before field use.'
  review_summary_uk: Tella — застосунок для документування, який підтримує правозахисна неприбуткова організація
    Horizontal. У документації описано зашифроване знімання та зберігання фото, відео й аудіо всередині застосунку,

  review_summary_en: 'Origin is a small static C2PA verifier that runs entirely in the browser and uploads nothing.
    It reads Content Credentials, checks the cryptographic record and reports what the signer claimed. Its core
    rules explicitly distinguish three states: no credentials means no conclusion; claims are attributed rather
    than asserted; and an unrecognised certificate is not the same thing as evidence of tampering.'
  review_workflow_en: Store the credential state, signer identity or certificate information, manifest claim and
    integrity result as separate fields. Treat a valid credential as provenance evidence, then corroborate the underlying
    event or depicted content independently.
  review_summary_uk: 'Origin — невеликий статичний C2PA-verifier, який працює повністю в браузері й нічого не завантажує
    на сервер. Він читає Content Credentials, перевіряє криптографічний запис і показує, що саме заявив підписант.
    Базові правила проєкту чітко розділяють три стани: відсутність credentials не дає висновку; claims атрибутуються,
    а не проголошуються фактом; невідомий сертифікат не тотожний доказу tampering.'
  review_workflow_uk: Зберігайте credential state, дані підписанта або сертифіката, manifest claim і результат integrity-check
    як окремі поля. Валідний credential сприймайте як доказ provenance, а саму подію чи зображений зміст перевіряйте
    незалежно.

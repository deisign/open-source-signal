  archive_review: true
  review_summary_en: The ICIJ Offshore Leaks Database exposes a searchable graph of more than 810,000 offshore companies,
    foundations and trusts drawn from the Offshore Leaks, Panama Papers, Bahamas Leaks, Paradise Papers and Pandora
    Papers investigations. Records connect entities to officers, intermediaries, addresses and jurisdictions, and
    the full dataset can be downloaded in CSV or Neo4j formats. ICIJ also provides a reconciliation API for matching
    entities from external datasets.
  review_workflow_en: Start from a well-identified public-interest person or company, record the exact database
    node and investigation source, then follow relationship edges one step at a time. Preserve names, roles, dates
    and jurisdictions as separate fields and check current status in official corporate registries. For bulk work,
    use the downloadable data or reconciliation API while retaining the original match score and source node so
    that false positives can be reviewed.
  review_summary_uk: ICIJ Offshore Leaks Database — пошуковий граф більш ніж 810 тисяч офшорних компаній, фондів
    і трастів із розслідувань Offshore Leaks, Panama Papers, Bahamas Leaks, Paradise Papers та Pandora Papers. Записи
    пов’язують юридичні структури з посадовцями, посередниками, адресами й юрисдикціями, а повний набір можна завантажити
    у форматах CSV або Neo4j. ICIJ також надає API зіставлення для зв’язування сутностей із зовнішніми наборами
    даних.
  review_workflow_uk: Починайте з добре встановленої суспільно значущої особи або компанії, фіксуйте точний вузол
    бази та розслідування-джерело, а далі переходьте зв’язками по одному кроку. Імена, ролі, дати й юрисдикції зберігайте
    окремими полями та перевіряйте поточний стан в офіційних корпоративних реєстрах. Для масової роботи використовуйте
    завантажувані дані або API зіставлення, зберігаючи оцінку збігу й початковий вузол для перегляду можливих помилок.

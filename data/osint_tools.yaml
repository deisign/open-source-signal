  review_summary_en: Metawarc's 2.0 implementation indexes WARC files into a versioned DuckDB catalogue with Parquet
    sidecars. It supports bounded metadata extraction, hashes, duplicate analysis, link analysis, payload export
    and integrity checks while treating source archives as immutable. The project also provides typed CLI, REST
    and read-only MCP interfaces with explicit limits around raw SQL, payload access and non-loopback network exposure.
  review_workflow_en: Keep source WARCs read-only, index them into a versioned workspace, record the Metawarc version
    and archive IDs, then run bounded reports for hashes, metadata, duplicates and links. Export only the subset
    required for review and preserve the generated manifest with checksums.

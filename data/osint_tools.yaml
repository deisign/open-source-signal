  review_summary_en: Iconem's browser tool compares historical imagery from sources such as Esri Wayback and Planet
    monthly basemaps against other tiled basemaps. It supports split or side-by-side views, timeline stepping and
    GeoTIFF export for further work in QGIS. The project was recently proposed for inclusion in the Bellingcat Toolkit
    and was verified here against Iconem's original repository rather than the catalogue suggestion.
  review_workflow_en: Use the viewer to identify candidate change dates, record imagery provider and visible timestamp,
    export the relevant frame when licensing permits, then confirm the finding in the provider's own catalogue or
    another independent source. Preserve screenshots only as working notes, not as the sole evidence object.
  review_summary_uk: Браузерний інструмент Iconem порівнює історичні зображення з таких джерел, як Esri Wayback
    і щомісячні базові карти Planet, з іншими тайловими шарами. Є розділений або паралельний перегляд, переміщення
    часовою шкалою та експорт GeoTIFF для подальшої роботи в QGIS. Нещодавно проєкт запропонували додати до Bellingcat
    Toolkit; для цього випуску його перевірено за оригінальним репозиторієм Iconem, а не за каталогом.
  review_workflow_uk: Використовуйте переглядач, щоб визначити можливі дати змін, фіксуйте постачальника зображень
    і видиму дату, за дозволених ліцензійних умов експортуйте потрібний кадр, а потім підтверджуйте знахідку в каталозі
    самого постачальника або в іншому незалежному джерелі. Знімки екрана зберігайте як робочі нотатки, а не як єдиний
    доказовий об'єкт.

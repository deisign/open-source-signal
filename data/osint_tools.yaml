  review_summary_en: Google Fact Check Explorer is a search interface for fact checks published by participating
    publishers. Researchers can search by topic or person, filter by language and use image search to look for fact
    checks connected to a visual. Google states that it does not create or endorse the fact checks surfaced by the
    tool; disputes about a fact check belong with the publisher that produced it.
  review_workflow_en: Search several variants of the claim, names and key phrases, then repeat with the relevant
    language filters. For an image, use the image-search mode and compare publication dates, captions and the underlying
    fact-check evidence. Save the original claim you are investigating separately from the discovered checks, and
    cite the fact-check publisher rather than Fact Check Explorer when relying on a substantive finding.
  review_summary_uk: Google Fact Check Explorer — пошуковий інтерфейс для фактчеків, опублікованих редакціями та
    організаціями, що беруть участь у системі. Дослідник може шукати за темою чи людиною, фільтрувати за мовою та
    використовувати пошук за зображенням, щоб знайти перевірки, пов’язані з візуальним матеріалом. Google прямо
    зазначає, що не створює й не схвалює фактчеки, які показує інструмент; за зміст відповідає видавець перевірки.
  review_workflow_uk: Шукайте кілька варіантів формулювання твердження, імен і ключових фраз, а потім повторюйте
    пошук із потрібними мовними фільтрами. Для зображення використовуйте відповідний режим і порівнюйте дати публікації,
    підписи та докази в самій перевірці. Початкове твердження зберігайте окремо від знайдених фактчеків, а посилаючись
    на змістовний висновок, цитуйте редакцію, що провела перевірку, а не Fact Check Explorer.

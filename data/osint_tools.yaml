  review_summary_en: C2PA Tool is a command-line utility for reading and validating C2PA manifests attached to supported
    image, audio and video assets. It can return a JSON summary or lower-level report of provenance claims and can
    also create manifests. The wider Content Authenticity Initiative tooling uses cryptographic signatures and trust
    lists to validate whether credentials were signed by a recognized chain.
  review_workflow_en: Preserve the original file and hash before inspection. Record the C2PA Tool version, validation
    result, signer information, manifest assertions, declared edit actions and any trust warnings. Export the JSON
    report alongside the source file. Then perform normal image or video verification independently and note where
    provenance data supports, contradicts or does not address the factual claim.
  review_summary_uk: C2PA Tool — засіб командного рядка для читання й перевірки маніфестів C2PA, прикріплених до
    підтримуваних зображень, аудіо та відео. Він може повертати стислий звіт у JSON або детальніші відомості про
    заявлене походження, а також створювати маніфести. Екосистема Content Authenticity Initiative використовує криптографічні
    підписи й списки довіри для перевірки того, чи підписано відомості визнаним ланцюгом сертифікатів.
  review_workflow_uk: Перед перевіркою збережіть первинний файл і його контрольну суму. Зафіксуйте версію C2PA Tool,
    результат перевірки, відомості про підписувача, твердження маніфесту, заявлені дії редагування та попередження
    щодо довіри. Збережіть звіт JSON поруч із вихідним файлом. Після цього незалежно проведіть звичайну верифікацію
    зображення чи відео й зазначте, де дані про походження підтримують твердження, суперечать йому або взагалі його
    не стосуються.

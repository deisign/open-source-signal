  archive_review: true
  review_summary_en: Dangerzone is a free open-source desktop application maintained by Freedom of the Press Foundation.
    It accepts potentially dangerous PDFs, office documents and images, processes them in an isolated environment
    without network access, renders document pages to pixel data and reconstructs them locally as PDFs. The project
    currently offers version 0.11.0 for major desktop operating systems.
  review_workflow_en: Do not open the original merely to decide whether it looks suspicious. Preserve it in a controlled
    location, record its source and hash, and create a Dangerzone output for routine reading. Keep the derivative
    explicitly linked to the original. If embedded objects, formulas, macros or original metadata later become evidentially
    relevant, review them only in an appropriately isolated forensic environment.
  review_summary_uk: Dangerzone — безплатний застосунок з відкритим кодом для настільних систем, який підтримує
    Freedom of the Press Foundation. Він приймає потенційно небезпечні PDF, офісні документи та зображення, обробляє
    їх в ізольованому середовищі без доступу до мережі, перетворює сторінки на піксельні дані й локально збирає
    з них новий PDF. Нині проєкт пропонує версію 0.11.0 для основних настільних операційних систем.
  review_workflow_uk: Не відкривайте оригінал лише для того, щоб вирішити, чи він підозрілий. Збережіть його в контрольованому
    місці, зафіксуйте джерело й контрольну суму та створіть копію Dangerzone для звичайного читання. Явно пов'яжіть
    похідний файл з оригіналом. Якщо вбудовані об'єкти, формули, макроси або первинні метадані згодом стануть доказово
    важливими, досліджуйте їх лише у відповідно ізольованому криміналістичному середовищі.

    href: weekly/open-source-signal-weekly-2026-W41.html
  archive_review: true
  review_summary_en: Crush is an open-source desktop forensic workbench for archives, mobile backups, disk images,
    logical evidence containers, databases, structured data, media and documents. It opens many sources without
    extracting or mounting them first. Integrity mode hashes supported source types on open and gives exports a
    hash manifest, while its forensic test suite checks source immutability, absence of side-effect files, read-only
    media handling, known-output references and reproducibility. Hex provenance can map selected SQLite, Protobuf,
    MMKV or Realm values back to their exact source bytes.
  review_workflow_en: Hash the original source first, work from a preserved copy, keep exported artifacts and hash
    manifests separate, and record the Crush version when a parsed value becomes part of an evidentiary claim.
  review_summary_uk: Crush — open-source desktop forensic workbench для archives, mobile backups, disk images, logical
    evidence containers, databases, structured data, media та документів. Багато джерел він відкриває без попереднього
    extraction або mounting. Integrity mode хешує підтримувані source types під час відкриття й додає hash manifest
    до exports, а forensic test suite перевіряє source immutability, відсутність side-effect files, read-only роботу
    з media, known-output references і reproducibility. Hex provenance дозволяє прив'язати вибрані значення SQLite,
    Protobuf, MMKV або Realm до точних байтів джерела.
  review_workflow_uk: Спочатку хешуйте оригінальне джерело, працюйте зі збереженою копією, тримайте exported artifacts
    і hash manifests окремо та фіксуйте версію Crush, коли parsed value стає частиною доказового твердження.

    Parquet. Інструмент підтримує контрольоване вилучення метаданих, обчислення контрольних сум, пошук дублікатів,
    аналіз посилань, експорт вмісту й перевірки цілісності, при цьому вихідні архіви вважаються незмінними. Проєкт
    також має типізовані інтерфейси командного рядка, REST і MCP лише для читання з явними обмеженнями щодо довільного
    SQL, доступу до вмісту й мережевого відкриття сервісу.
  review_workflow_uk: Зберігайте вихідні WARC лише для читання, індексуйте їх у версійований робочий простір, фіксуйте
    версію Metawarc та ідентифікатори архівів, а потім запускайте обмежені звіти за контрольними сумами, метаданими,
    дублікатами й посиланнями. Експортуйте лише потрібну для перевірки частину й зберігайте створений маніфест із
    контрольними сумами.

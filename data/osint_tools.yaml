  archive_review: true
  review_summary_en: ChronoVerify checks image hashes, EXIF/XMP metadata, capture time, device information and C2PA
    Content Credentials, then adds pixel-level forensic signals. Its public method explicitly distinguishes reproducible
    integrity facts from a probabilistic verdict and says the result is triage rather than proof. The service states
    that uploaded images are processed for the check and not retained; a free browser verifier and rate-limited
    API are available.
  review_workflow_en: Preserve the original file first and record its hash locally. Run provenance and metadata
    checks, save the method/version and verdict, then corroborate the scene independently with source history, reverse
    search, geolocation and chronology. Escalate anomalies for human review rather than auto-rejecting the media.
  review_summary_uk: ChronoVerify перевіряє контрольні суми зображення, метадані EXIF/XMP, час знімання, дані про
    пристрій і C2PA Content Credentials, а потім додає піксельні криміналістичні ознаки. У відкритому описі методики
    окремо розділено відтворювані факти цілісності та ймовірнісний висновок; результат прямо визначено як первинну
    перевірку, а не доказ. Сервіс заявляє, що завантажені зображення обробляються лише для перевірки й не зберігаються;
    доступні безкоштовний вебінтерфейс і обмежений за частотою прикладний інтерфейс.
  review_workflow_uk: Спочатку збережіть оригінальний файл і локально зафіксуйте його контрольну суму. Перевірте
    походження та метадані, збережіть версію методики й результат, а потім незалежно звірте саму сцену за історією
    джерела, зворотним пошуком, геолокацією та хронологією. Аномалії передавайте на ручну перевірку, а не відхиляйте
    матеріал автоматично.

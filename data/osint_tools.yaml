  review_summary_en: OpenCorporates describes itself as an open company database containing records for more than
    200 million companies and linking data back to primary public sources. Its API exposes company information in
    structured form, and its OpenRefine reconciliation service can match messy company-name lists to candidate legal
    entities. API access requires a key, with limits and licence conditions depending on use.
  review_workflow_en: Search by name, narrow by jurisdiction, compare company numbers, current and previous names,
    and follow the cited registry source. For bulk work, reconcile candidate matches in OpenRefine and require human
    review for ambiguous rows. Store the OpenCorporates record together with the underlying registry citation rather
    than replacing the registry with the aggregator.
  review_summary_uk: OpenCorporates описує себе як відкриту базу корпоративних даних із записами про понад 200 мільйонів
    компаній і посиланнями на первинні публічні джерела. API надає корпоративну інформацію у структурованому вигляді,
    а сервіс зіставлення для OpenRefine дозволяє прив'язувати списки з різними написаннями назв до кандидатів на
    конкретні юридичні особи. Для API потрібен ключ, а обмеження й умови ліцензії залежать від способу використання.
  review_workflow_uk: Шукайте за назвою, звужуйте за юрисдикцією, порівнюйте реєстраційні номери, чинні й попередні
    назви та переходьте до зазначеного реєстрового джерела. Для масових списків зіставляйте кандидатів через OpenRefine
    й залишайте неоднозначні рядки на ручну перевірку. Зберігайте запис OpenCorporates разом із посиланням на первинний
    реєстр, а не підміняйте реєстр агрегатором.

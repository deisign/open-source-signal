  review_summary_en: GeoLibre 1.0 was introduced as a lightweight open-source GIS that runs in a browser, as a desktop
    app or inside a Jupyter notebook. It can load vector and raster data, stream Cloud Optimized GeoTIFF and GeoParquet,
    work with PMTiles, 3D tiles, LiDAR point clouds, DuckDB, WMS/WFS and local project files.

  review_summary_en: OpenRefine is a free open-source application for cleaning, transforming and extending messy
    tabular data. It provides facets, clustering, transformations, operation history with undo and replay, and reconciliation
    against external services such as Wikidata or other compatible authorities. Its documentation stresses that
    clustering is syntactic and reconciliation is semi-automated, requiring human review.
  review_workflow_en: Import a copy of the source dataset, profile columns with facets, cluster only the fields
    where string variation is expected, review every merge rule, and export the operation history alongside the
    cleaned data. For entities, reconcile against an authority and keep the original value, chosen identifier and
    confidence or review state in separate fields.
  review_summary_uk: OpenRefine — безкоштовний застосунок із відкритим кодом для очищення, перетворення та доповнення
    неохайних табличних даних. Він підтримує фасети, групування схожих значень, перетворення, історію операцій із
    скасуванням і повторенням, а також зіставлення із зовнішніми сервісами на кшталт Wikidata та інших сумісних
    довідників. Документація наголошує, що групування працює на рівні написання, а зіставлення є напівавтоматичним
    і потребує людської перевірки.
  review_workflow_uk: Імпортуйте копію початкового набору, дослідіть колонки через фасети, групуйте лише поля, де
    очікуються варіанти написання, перевіряйте кожне правило злиття й експортуйте історію операцій разом з очищеними
    даними. Для сутностей виконуйте зіставлення з авторитетним довідником і зберігайте початкове значення, вибраний
    ідентифікатор та стан перевірки в окремих полях.

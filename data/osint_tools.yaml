  archive_review: true
  review_summary_en: The Deportation Data Project at UC Berkeley and UCLA obtains immigration-enforcement data through
    freedom-of-information requests and publishes both agency-original files and processed datasets. Its ICE material
    covers arrests, detainers, detention stays and stints, encounters, removals, facilities and field offices, with
    documentation, codebooks and processing code. The project explicitly distinguishes original data from simplified
    or joined tables and documents likely duplicates and uncertain field meanings. The latest portal also retains
    historical releases rather than presenting only one current spreadsheet.
  review_workflow_en: Download and hash the raw agency files, processed tables, codebook and processing repository
    for the same release. Record release date, agency coverage period, table name, row meaning, person identifier,
    event identifier, missingness, duplicate flag, transformation version and citation. Write joins as reproducible
    code and retain unmatched rows. Before publishing a count, define the unit — people, actions, stays, transfers
    or removals — and state the deduplication and date logic. Create a correction table when later releases revise
    or remove fields.
  review_summary_uk: Deportation Data Project при Каліфорнійських університетах у Берклі та Лос-Анджелесі отримує
    дані про імміграційне правозастосування через запити на доступ до інформації й оприлюднює як первинні файли
    органів, так і опрацьовані масиви. Матеріали ICE охоплюють затримання, вимоги до місцевих установ утримувати
    людину, перебування в центрах, контакти з органом, видворення, установи й польові підрозділи, а також документацію,
    довідники полів і код опрацювання. Проєкт явно відділяє первинні дані від спрощених або з’єднаних таблиць та
    описує можливі повтори й невизначені значення полів. Портал також зберігає попередні випуски, а не показує лише
    одну поточну таблицю.
  review_workflow_uk: Завантажте й обчисліть контрольні суми первинних файлів органу, опрацьованих таблиць, довідника
    та сховища коду для одного випуску. Фіксуйте дату випуску, період охоплення органу, назву таблиці, значення
    рядка, ідентифікатор людини, ідентифікатор події, пропуски, позначку можливого повтору, версію перетворення
    й спосіб цитування. Виконуйте з’єднання відтворюваним кодом і зберігайте рядки без збігу. До публікації числа
    визначте одиницю — люди, дії, перебування, переведення чи видворення — і поясніть усунення повторів та часову
    логіку. Створюйте таблицю виправлень, коли наступні випуски змінюють або вилучають поля.

  archive_review: true
  review_summary_en: Bellingcat's AIS Imagery Search is a browser-based project that accepts user-supplied AIS ship-tracking
    data and searches Sentinel and Landsat catalogues for satellite scenes whose footprints overlap the vessel's
    approximate position at the imagery capture time. The tool parses timestamped longitude and latitude rows, normalises
    time to UTC, reduces very dense tracks for querying, searches imagery in chronological chunks, removes duplicate
    scene records, checks both temporal and spatial overlap, displays the track and matching footprints, and exports
    a shortlist as JSON or CSV. The repository emphasises that users must bring their own AIS data.
  review_workflow_en: Start with a preserved AIS export whose source, time zone, collection period and vessel identifier
    are documented. Save the original file and hash, then record the tool version or repository commit, query time,
    temporal chunk size, spatial tolerance, imagery collections, candidate count and exported shortlist. For each
    shortlisted scene preserve the satellite product identifier, acquisition time, footprint, cloud or visibility
    limits and the matching AIS point. Confirm any substantive finding with the image itself, other dates, port
    observations, corporate or customs records and alternative movement sources.
  review_summary_uk: Bellingcat AIS Imagery Search — браузерний проєкт, який приймає надані дослідником дані AIS
    про рух судна та шукає в каталогах Sentinel і Landsat супутникові сцени, чиї межі перетинаються з приблизним
    положенням судна в момент знімання. Засіб читає координати з часовими позначками, переводить час до UTC, скорочує
    надто щільний маршрут для запиту, шукає знімки за часовими відрізками, усуває повтори, перевіряє часовий і просторовий
    перетин, показує маршрут і межі знайдених сцен та вивантажує перелік у JSON або CSV. Власні дані AIS дослідник
    має надати сам.
  review_workflow_uk: Починайте зі збереженого вивантаження AIS, для якого відомі джерело, часовий пояс, період
    збирання та ідентифікатор судна. Збережіть первинний файл і контрольну суму, а далі фіксуйте версію засобу або
    стан сховища коду, час запиту, розмір часових відрізків, просторовий допуск, колекції знімків, кількість кандидатів
    і вивантажений перелік. Для кожної сцени зберігайте ідентифікатор супутникового продукту, час знімання, межі,
    обмеження хмарністю чи видимістю та відповідну точку AIS. Змістовний висновок підтверджуйте самим знімком, іншими
    датами, портовими спостереженнями, корпоративними чи митними записами та альтернативними даними руху.

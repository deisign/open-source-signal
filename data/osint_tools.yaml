  review_summary_en: SingleFile CLI runs a browser-driven capture from the command line and saves a web page with
    its resources into one HTML file. The project supports direct execution, package-manager installation and Docker,
    making it practical for repeatable capture jobs rather than manual browser saving.
  review_workflow_en: Capture only public material you are authorised to access. Save the original URL, capture
    time, tool version, browser version and SHA-256 of the output. For important evidence, pair the SingleFile copy
    with WARC or an independent archival service so one rendering method is not the sole record.
  review_summary_uk: SingleFile CLI запускає кероване браузером збереження з командного рядка й пакує вебсторінку
    разом із ресурсами в один HTML-файл. Проєкт підтримує безпосередній запуск, встановлення через менеджери пакетів
    і Docker, тому його зручно використовувати у відтворюваних завданнях зі збереження сторінок, а не лише вручну
    в браузері.
  review_workflow_uk: Зберігайте лише публічний матеріал, до якого маєте законний доступ. Фіксуйте початкову адресу,
    час збереження, версію інструмента, версію браузера та SHA-256 вихідного файла. Для важливих доказів доповнюйте
    SingleFile-копію WARC-збереженням або незалежним архівним сервісом, щоб один спосіб відтворення не був єдиним
    записом.

  review_summary_en: MoD announced approximate air-threat markers in the Air Alert app. Data are preprocessed, may
    be delayed and omit ballistic missiles and other targets travelling above 2,000 km/h.
  review_workflow_en: 'Follow official alerts: enter shelter on an alert and remain until the all-clear. For retrospective
    research, record the display time and the map’s stated limitations.'
  review_summary_uk: МОУ повідомило про приблизні позначки повітряних загроз у застосунку «Повітряна тривога». Дані

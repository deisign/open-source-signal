  review_summary_en: Turnstone is an open-source application for collecting, storing and querying historical ADS-B
    aircraft data. Its interface lets researchers draw geographic areas, choose date and time ranges, filter by
    altitude, speed, bearing and aircraft type, compare movements across two areas, review aggregate statistics
    and export results as CSV. The code can be self-hosted; Bellingcat also provides selective access to a hosted
    instance because data storage and processing are costly.
  review_workflow_en: Define the investigative question before querying. Save the bounding boxes, time zone, date
    range, filters, dataset snapshot, query identifier, result export and reviewer notes. For each candidate aircraft,
    preserve the hex code, registration and type source, positions and timestamps, ownership claim, corroborating
    airport or corporate records, contradictions and publication decision. Treat the tool as candidate generation
    and reproduce the query before publication.
  review_summary_uk: Turnstone — інструмент із відкритим кодом для збирання, зберігання й пошуку в історичних даних
    ADS-B про рух літаків. Інтерфейс дає змогу окреслювати ділянки на карті, задавати час, відбирати записи за висотою,
    швидкістю, напрямком і типом борту, порівнювати рух між двома районами, переглядати узагальнені показники та
    вивантажувати результати у CSV. Код можна розгорнути самостійно; доступ до розміщеної Bellingcat версії вибірковий
    через вартість зберігання й опрацювання даних.
  review_workflow_uk: До запиту сформулюйте дослідницьке питання. Збережіть межі ділянок, часовий пояс, проміжок
    дат, умови відбору, версію масиву, ідентифікатор запиту, вивантаження та примітки перевіряча. Для кожного борту
    фіксуйте шістнадцятковий код, джерело реєстрації й типу, координати та час, твердження про власника, підтвердження
    з аеропортових або корпоративних записів, суперечності й рішення щодо публікації. Використовуйте засіб для створення
    переліку кандидатів і повторюйте запит перед виходом матеріалу.

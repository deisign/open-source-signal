    compare them with imagery or open basemap layers, inspect attributes, measure distances and export a project
    file into the evidence package. For sensitive layers, prefer local mode and keep shared static links disabled
    unless the map has been redacted.'
  review_summary_uk: GeoLibre 1.0 представлено як легку open-source GIS, що працює в браузері, як desktop app або
    всередині Jupyter notebook. Інструмент може відкривати vector і raster data, стримити Cloud Optimized GeoTIFF
    і GeoParquet, працювати з PMTiles, 3D tiles, LiDAR point clouds, DuckDB, WMS/WFS та локальними project files.
  review_workflow_uk: 'Використовуйте GeoLibre для першого перегляду геоданих: завантажте GeoJSON, KML або CSV із
    точками інцидентів, порівняйте з imagery або open basemap, перегляньте атрибути, виміряйте відстані й збережіть
    project file до доказового пакета. Для чутливих шарів краще працювати локально й не вмикати shared static links
    без редагування карти.'

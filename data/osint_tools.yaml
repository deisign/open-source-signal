  review_summary_en: 'OpenOSINT 2.29.1 fixed a web-UI security issue in which any website open in the same browser
    could drive the local server while `openosint web` was running. The release added Host validation, blocks cross-site
    browser requests to `/api/*` except `/api/health`, and requires `Content-Type: application/json` for `/api/setup`.
    The project says the MCP server, CLI and REPL are not affected and recommends that all web-UI users upgrade.'
  review_workflow_en: Upgrade web-UI installations to 2.29.1 or later, verify allowed hosts and origins, and treat
    every local browser-facing API as an attack surface rather than assuming loopback binding alone provides sufficient
    isolation.
  review_summary_uk: 'OpenOSINT 2.29.1 виправив проблему безпеки web-інтерфейсу, за якої будь-який сайт, відкритий
    у тому самому браузері, міг керувати локальним сервером під час роботи `openosint web`. У релізі додано перевірку
    Host, блокування cross-site браузерних запитів до `/api/*` за винятком `/api/health`, а `/api/setup` тепер вимагає
    `Content-Type: application/json`. Проєкт зазначає, що MCP-сервер, CLI та REPL не постраждали, і рекомендує всім
    користувачам web-інтерфейсу оновитися.'
  review_workflow_uk: Оновіть інсталяції web-інтерфейсу до 2.29.1 або новішої версії, перевірте дозволені hosts

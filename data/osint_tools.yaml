  archive_review: true
  review_summary_en: The Open Source Munitions Portal is a structured visual reference for documented munitions
    and remnants. Records can be filtered by reported location, year, munition category, functional use, tentative
    model, colour and markings, condition, mechanical features, guidance, domain, fins, calibre and other observable
    characteristics. Individual entries preserve a source, reported location, date where available, related images
    and citations. The portal prominently warns users never to approach munitions. Ukraine is one of the represented
    locations, including records sourced to Ukrainian state bodies and other public material.
  review_workflow_en: Work from photographs taken by trained authorities, investigators or other safe sources rather
    than handling the object. Record the image provenance, date, location status, scale reference, visible markings,
    dimensions where reliably documented, fins, fasteners, electronics, guidance components, paint, damage state
    and every excluded alternative. Save the OSMP record identifier and retrieval date for each comparison. Escalate
    an exact-model finding only when multiple independent features and documentary sources agree, and keep manufacturer,
    operator and legal attribution as separate questions.
  review_summary_uk: 'Open Source Munitions Portal — впорядкований візуальний довідник задокументованих боєприпасів
    і їхніх залишків. Записи можна відбирати за заявленим місцем, роком, категорією, призначенням, попередньо визначеною
    моделлю, кольором і маркуванням, станом, механічними ознаками, наведенням, середовищем застосування, оперенням,
    калібром та іншими видимими характеристиками. Окремий запис зберігає джерело, заявлене місце, дату за наявності,
    пов’язані зображення й посилання. Портал окремо застерігає: до боєприпасів не можна наближатися. Серед місць
    є й Україна, зокрема записи з матеріалів українських державних органів та інших відкритих джерел.'
  review_workflow_uk: Працюйте з фотографіями, зробленими підготовленими фахівцями, слідчими або іншими безпечними
    джерелами, а не з самим предметом. Фіксуйте походження зображення, дату, стан встановлення місця, масштаб, видимі
    написи, надійно відомі розміри, оперення, кріплення, електронні й навігаційні складники, фарбування, стан пошкодження
    та кожну відхилену альтернативу. Для порівняння зберігайте ідентифікатор запису OSMP і дату перегляду. До точного
    визначення моделі переходьте лише тоді, коли збігаються кілька незалежних ознак і документальні джерела, а виробника,
    оператора та правову відповідальність перевіряйте окремо.

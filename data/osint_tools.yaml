  archive_review: true
  review_summary_en: Global Fishing Watch’s Vessel Viewer is an open vessel-history and risk-insight tool developed
    with TMT. It searches hundreds of thousands of industrial fishing and non-fishing vessels and combines identity
    information from public registries with AIS and, where available, VMS-derived activity. Vessel profiles can
    show historical tracks, apparent fishing, port visits, transshipments, authorisations and related-vessel information.
    Registered users can access additional search, analysis and download features, while profiles and reports can
    be exported for offline review.
  review_workflow_en: Start from a stable vessel identifier such as IMO number where available. Preserve the profile
    URL, identity fields, registry sources, date range and exported historical data. Treat port visits, encounters
    and apparent fishing as event candidates to corroborate with satellite imagery, port records, company filings,
    sanctions lists or customs data. Record identity changes over time rather than overwriting an older flag, owner
    or operator.
  review_summary_uk: Global Fishing Watch Vessel Viewer — відкритий інструмент історії суден і оцінювання ризиків,
    розроблений разом із TMT. Він дає змогу шукати серед сотень тисяч промислових риболовних і нериболовних суден
    та поєднує відомості про ідентичність із публічних реєстрів із даними AIS і, де вони доступні, VMS. Профілі
    можуть показувати історичні треки, ймовірну риболовну активність, заходи в порти, перевалки, дозволи та пов’язані
    судна. Після реєстрації доступні додаткові можливості пошуку, аналізу й вивантаження.
  review_workflow_uk: Починайте зі сталого ідентифікатора судна, наприклад номера IMO, якщо він є. Зберігайте посилання
    на профіль, поля ідентичності, джерела реєстрів, часовий проміжок і вивантажені історичні дані. Заходи в порти,
    зустрічі та ймовірну риболовну активність розглядайте як кандидати для підтвердження супутниковими знімками,
    портовими записами, корпоративними документами, санкційними списками або митними даними. Зміни прапора, власника
    чи оператора ведіть у часі, не переписуючи старий стан.

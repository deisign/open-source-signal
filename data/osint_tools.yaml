    звичайні веб-сторінки й локальні документи на Markdown, текст, посилання, metadata, JSON-LD і результати crawl.
    Він працює через CLI, Python, Docker/API або MCP і позиціонує дизайн навколо локального стану та явних режимів
    помилки замість удаваного успіху для кожної сторінки.
  review_workflow_uk: 'Використовуйте його як ingestion-шар, а не як механізм винесення висновків: окремо зберігайте
    URL, час отримання, режим вилучення, стан відповіді/помилки та витягнутий контент. Для повторюваних полів віддавайте
    перевагу детермінованому вилученню, а необов''язкове LLM-вилучення маркуйте явно.'

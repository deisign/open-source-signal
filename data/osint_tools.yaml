  review_summary_en: VideoMasker is a browser-based video redaction tool that automatically detects faces and lets
    the user apply mosaic or blur masks on a timeline. Its public documentation says processing happens inside the
    browser with no server upload; basic mosaic redaction is free, while some advanced controls are paid.
  review_workflow_en: Work from a copy, never the evidentiary master. Run automatic detection, inspect the full
    timeline manually, add or extend masks where detection fails, export a publication derivative and preserve the
    untouched original separately with access controls and hashes.
  review_summary_uk: VideoMasker — браузерний інструмент для знеособлення відео, який автоматично знаходить обличчя
    й дозволяє накладати мозаїку або розмиття на часовій шкалі. У публічній документації заявлено, що обробка відбувається
    всередині браузера без завантаження відео на сервер; базове мозаїчне приховування безкоштовне, частина розширених
    функцій платна.
  review_workflow_uk: Працюйте з копією, а не з доказовим оригіналом. Запустіть автоматичне виявлення, вручну перегляньте
    всю часову шкалу, додайте або продовжте маски там, де алгоритм помилився, експортуйте окрему публікаційну версію,
    а недоторканий оригінал зберігайте окремо з контролем доступу та контрольними сумами.

  review_summary_en: 'Timesketch is an open-source platform for collaborative timeline analysis. A sketch can combine
    multiple timelines and support search, targeted views, comments and stories. The documented import paths include
    Plaso, CSV and JSONL, with mandatory concepts such as event message, ISO-formatted datetime and a description
    of what the timestamp represents. The project explicitly notes that Timesketch is not a parser: input data must
    already be parsed or prepared.'
  review_workflow_en: Normalise all imported times to an explicit timezone, preserve the original timestamp string,
    state what each timestamp means, and attach source identifiers before ingestion. Use separate timelines for
    materially different source classes, then create saved views and analyst comments without overwriting the imported
    event.
  review_summary_uk: 'Timesketch — платформа з відкритим кодом для спільного аналізу хронологій. Одна робоча область
    може поєднувати кілька часових ліній і підтримує пошук, вибрані подання, коментарі та історії. Документовані
    способи імпорту охоплюють Plaso, CSV і JSONL, а серед основних понять є опис події, дата й час у стандартному
    форматі та пояснення того, що саме означає ця часова позначка. Проєкт окремо наголошує, що Timesketch не є парсером:
    вхідні дані мають бути вже розібрані або підготовлені.'
  review_workflow_uk: Перед імпортом нормалізуйте час до явно зазначеного часового поясу, зберігайте первинний рядок
    часу, пояснюйте значення кожної часової позначки й додавайте ідентифікатор джерела. Для суттєво різних класів
    джерел використовуйте окремі часові лінії, а збережені подання та коментарі аналітика створюйте без переписування
    імпортованої події.

  review_summary_en: geo-sleuth is an Agent Skill for Claude Code, Codex, Cursor, Gemini CLI, OpenCode and GitHub
    Copilot that searches for where a photo was taken using OpenStreetMap geometry, elevation skylines, satellite
    tiles, street-level imagery and other ranked evidence. Its current method requires conclusions to point to the
    clue used, the command run and the file produced. The project separates scripted search and ranking from model
    judgment, and returns coordinates with an error radius, camera heading, evidence image and graded confidence.
  review_workflow_en: Treat the returned location as a candidate until independent map, terrain, street-level or
    dated-imagery checks confirm it. Preserve the clue list, commands, candidate-board state, generated evidence
    files and reported error radius with the case record.
  review_summary_uk: geo-sleuth — Agent Skill для Claude Code, Codex, Cursor, Gemini CLI, OpenCode та GitHub Copilot,
    який шукає місце зйомки фото через геометрію OpenStreetMap, профілі рельєфу, satellite tiles, street-level imagery
    та інші ранжовані докази. Поточна методика вимагає, щоб висновок посилався на використану ознаку, виконану команду
    та створений файл. Проєкт розділяє scripted search і ranking від модельного judgment та повертає координати
    з радіусом похибки, напрямком камери, evidence image і graded confidence.
  review_workflow_uk: Сприймайте повернуту локацію як кандидата, доки її незалежно не підтвердять карти, рельєф,
    street-level imagery або датовані знімки. Зберігайте список ознак, команди, стан candidate board, створені evidence
    files і заявлений радіус похибки разом із матеріалами кейсу.

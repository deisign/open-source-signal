  review_summary_en: The Content Authenticity Initiative's C2PA Conformance Tool validates C2PA manifests locally
    in the browser through a c2pa-rs WebAssembly build. It checks signatures against official and interim trust
    lists, exposes manifest claims, ingredients, validation status and a provenance tree, supports sidecar .c2pa
    files, and exports raw crJSON. Each downloaded report includes the exact conformance-tool git commit and build
    date that produced it.
  review_workflow_en: Save the source media, exported crJSON report and verifier commit together. Record signer
    claims as attributed provenance evidence, then verify the depicted event, time and location independently.
  review_summary_uk: C2PA Conformance Tool від Content Authenticity Initiative перевіряє C2PA manifests локально
    в браузері через WebAssembly-збірку c2pa-rs. Він перевіряє signatures за офіційним та interim trust lists, показує
    manifest claims, ingredients, validation status і provenance tree, підтримує sidecar-файли .c2pa та експортує
    raw crJSON. Кожен завантажений report містить точний git commit і build date версії conformance tool, яка його
    створила.
  review_workflow_uk: Зберігайте вихідний media-файл, експортований crJSON report і commit verifier разом. Фіксуйте
    signer claims як атрибутований provenance evidence, а подію, час і місце на зображенні перевіряйте незалежно.

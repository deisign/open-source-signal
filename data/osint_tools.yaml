  review_summary_en: Birdbrain is a local-first open-source desktop app with a Chromium extension for investigators
    and journalists. A capture stores MHTML, a full-page screenshot and extracted page text in a local case folder.
    The app hashes stored bytes with SHA-256, appends a signed entry to a hash-chained manifest and requests an
    RFC 3161 timestamp token for the content hash. Exported packages include a VERIFY.md procedure using standard
    command-line tools so the recipient does not need Birdbrain installed.
  review_workflow_en: Capture important public sources before analysis, keep the original URL and capture metadata,
    and export the evidence package separately from analytical notes. Verify the manifest and hashes when material
    moves between investigators or systems.
  review_summary_uk: Birdbrain — local-first open-source desktop-застосунок із Chromium extension для дослідників
    і журналістів. Capture зберігає MHTML, full-page screenshot і витягнутий текст сторінки в локальній папці кейсу.
    Застосунок рахує SHA-256 для збережених байтів, додає підписаний запис до hash-chained manifest і запитує RFC
    3161 timestamp token для content hash. Експортований пакет містить VERIFY.md із перевіркою стандартними CLI-інструментами,
    тому одержувачу не потрібен встановлений Birdbrain.
  review_workflow_uk: Фіксуйте важливі публічні джерела до аналізу, зберігайте оригінальний URL і capture metadata
    та експортуйте evidence package окремо від аналітичних нотаток. Перевіряйте manifest і hashes, коли матеріал
    передається між дослідниками або системами.

  archive_review: true
  review_summary_en: Open Supply Hub is a free, open data platform for production locations and supply-chain relationships.
    Organisations contribute facility lists, which the platform cleans, matches and deduplicates before assigning
    a reusable OS ID. Users can search by facility name, location, contributor and other fields, draw a geographic
    area, download data and use an API. The platform also exposes which organisations contributed particular facility
    information.
  review_workflow_en: Search broadly by name and geography, then inspect the OS ID, address, coordinates, contributor
    history, sector and parent-company fields. Preserve each contributor assertion separately and cross-check legal
    entity names against official registries. When joining your own dataset, keep the original source value alongside
    the matched OS ID and confidence so that a bad reconciliation can be reversed.
  review_summary_uk: Open Supply Hub — безплатна платформа відкритих даних про виробничі об’єкти та зв’язки в ланцюгах
    постачання. Організації додають списки об’єктів, після чого платформа очищує, зіставляє й усуває дублікати та
    присвоює багаторазовий ідентифікатор OS ID. Користувачі можуть шукати за назвою об’єкта, місцем, джерелом даних
    та іншими полями, виділяти географічну ділянку, вивантажувати дані й працювати через API. Також видно, які організації
    додали конкретні відомості.
  review_workflow_uk: Шукайте широко за назвою та географією, а потім перевіряйте OS ID, адресу, координати, історію
    джерел, сектор і поле материнської компанії. Твердження кожного джерела зберігайте окремо, а назви юридичних
    осіб звіряйте з офіційними реєстрами. Під час зведення власного набору даних залишайте первинне значення поруч
    із підібраним OS ID та рівнем упевненості, щоб помилкове зіставлення можна було скасувати.

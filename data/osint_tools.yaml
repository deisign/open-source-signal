  review_summary_en: BloomRepo 3.0 is a local-first Rust application for public GitHub discovery, repository-change
    monitoring and authorized local static analysis. Its security workspace inventories dependencies from common
    lockfiles, generates CycloneDX 1.5 JSON SBOMs, scrubs detected secrets from output and can query OSV for known
    vulnerabilities without executing scanned project code. The discovery layer also tracks releases, licences,
    descriptions and archive-state changes over time.
  review_workflow_en: 'Use it as a pre-execution checklist: repository state, recent changes, dependency inventory,
    SBOM, known vulnerabilities, then decide whether to inspect further in a sandbox. Preserve the SBOM and tool
    version with the investigation environment.'
  review_summary_uk: BloomRepo 3.0 — local-first Rust-застосунок для пошуку публічних GitHub-репозиторіїв, відстеження
    їхніх змін та authorized local static analysis. Security workspace інвентаризує dependencies із поширених lockfiles,
    генерує CycloneDX 1.5 JSON SBOM, прибирає знайдені secrets з output і може перевіряти відомі vulnerabilities
    через OSV без виконання коду сканованого проєкту. Discovery layer також відстежує зміни releases, licences,
    descriptions і archive state.
  review_workflow_uk: 'Використовуйте його як pre-execution checklist: стан репозиторію, останні зміни, dependency
    inventory, SBOM, відомі vulnerabilities — і лише потім вирішуйте, чи тестувати код далі в sandbox. Зберігайте
    SBOM і версію інструмента разом із середовищем розслідування.'

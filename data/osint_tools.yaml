  archive_review: true
  review_summary_en: Bellingcat’s Auto Archiver is an open-source tool for saving online material such as social
    media posts, videos, images and webpages from lists of URLs. It can be used with spreadsheets or command-line
    workflows and is designed for repeatable evidence capture rather than one-off manual screenshots.
  review_workflow_en: Feed URLs from a triage sheet, archive immediately, preserve media and screenshots, and record
    capture status back into the evidence log. For war-crimes documentation, pair each archived item with source
    URL, capture time, operator, storage path, hash or checksum if available, and later verification notes.
  review_summary_uk: 'Auto Archiver від Bellingcat — це open-source інструмент для збереження онлайн-матеріалів:
    постів у соцмережах, відео, зображень і вебсторінок зі списків URL. Його можна використовувати з таблицями або
    командним рядком, а головна ідея — повторюваний процес фіксації, а не випадкові ручні скріншоти.'
  review_workflow_uk: URL варто збирати в triage-таблицю, одразу архівувати, зберігати медіа й скріншоти, а статус
    фіксувати в evidence log. Для документування воєнних злочинів кожен архівований об’єкт має мати URL джерела,
    час фіксації, оператора, шлях зберігання, хеш або checksum за наявності та подальші нотатки верифікації.

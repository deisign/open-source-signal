  review_summary_en: Bellingcat’s browser-based Search Grid Generator lets a researcher select an area, choose a
    cell size and download a gridded KML file for Google Earth or another GIS application. The grid can divide a
    satellite or map search into named cells, reduce duplicate work and let a team assign sections. Bellingcat has
    documented its use by volunteers geolocating possible civilian-harm incidents in Ukraine.
  review_workflow_en: Save the area polygon, coordinate system, grid-cell size, generated KML and hash. Give every
    cell a stable identifier and record assignee, imagery source and date, search start and end, features sought,
    candidate locations, rejection reason, second reviewer and completion status. Keep the completed grid beside
    the evidence table rather than relying on colours alone.
  review_summary_uk: Браузерний Search Grid Generator від Bellingcat дає змогу вибрати ділянку, розмір клітинки
    та завантажити сітку у форматі KML для Google Earth або іншої геоінформаційної програми. Сітка ділить пошук
    на супутникових знімках чи картах на названі клітинки, зменшує повторну роботу й дозволяє розподілити ділянки
    між учасниками. Bellingcat описувала його використання волонтерами для геолокації можливих випадків шкоди цивільним
    в Україні.
  review_workflow_uk: Збережіть полігон ділянки, систему координат, розмір клітинки, створений KML і його контрольну
    суму. Надайте кожній клітинці сталий ідентифікатор та фіксуйте виконавця, джерело й дату знімка, початок і завершення
    пошуку, шукані ознаки, кандидатні місця, причину відхилення, другого перевіряча та стан виконання. Зберігайте
    заповнену сітку поруч із таблицею доказів, а не покладайтеся лише на кольори.

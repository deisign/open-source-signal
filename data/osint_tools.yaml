  review_summary_en: SHADOHDORKS is a browser tool that generates more than one thousand search-engine queries for
    a supplied domain. Its own interface presents categories including subdomain enumeration, exposed administration
    panels, API leaks and penetration-test reconnaissance, and warns that it is for authorised security testing.
    Indicator surfaced the tool as a community lead rather than a reviewed evidence platform. The generator does
    not itself validate whether a domain is in scope, whether a returned page is intentionally public, or whether
    opening and interacting with a result would be lawful.
  review_workflow_en: Use only on domains you own, administer or have explicit written authorisation to assess.
    Before generating queries, record the client or owner, authorised domains and subdomains, permitted search categories,
    prohibited actions, dates and reviewer. Limit use to passive search-engine results. Do not authenticate, submit
    forms, download private data, test tokens, bypass access controls or interact with exposed services. Save only
    the query, result URL, search date, public-interest relevance and responsible disclosure decision. For ordinary
    journalism, write narrow manual queries instead of generating the full offensive set.
  review_summary_uk: SHADOHDORKS — браузерний засіб, що створює понад тисячу запитів до пошукової системи для вказаного
    домену. Його інтерфейс містить категорії пошуку піддоменів, відкритих панелей керування, витоків програмних
    інтерфейсів і розвідки для випробування захисту та попереджає про використання лише з дозволом. Indicator подала
    засіб як спільнотну зачіпку, а не перевірену доказову платформу. Генератор не встановлює, чи входить домен до
    дозволених меж, чи сторінку навмисно зроблено відкритою та чи законно відкривати результат і взаємодіяти з ним.
  review_workflow_uk: Використовуйте лише для доменів, якими ви володієте, керуєте або маєте явний письмовий дозвіл
    на перевірку. До створення запитів зафіксуйте замовника чи власника, дозволені домени й піддомени, дозволені
    категорії, заборонені дії, строки та перевіряльника. Обмежтеся пасивними результатами пошукової системи. Не
    входьте до систем, не надсилайте форми, не завантажуйте приватні дані, не перевіряйте ключі, не обходьте обмеження
    й не взаємодійте з відкритими службами. Зберігайте лише запит, адресу результату, дату пошуку, суспільну значущість
    і рішення про відповідальне повідомлення. Для звичайної журналістики пишіть вузькі ручні запити замість створення
    всього наступального набору.

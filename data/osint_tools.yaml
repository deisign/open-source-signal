  review_summary_en: Tella is a documentation app maintained by the human-rights nonprofit Horizontal. Its documentation
    describes encrypted in-app capture and storage for photos, video and audio, hiding files from the normal device
    gallery, PIN/password protection and controlled transfer to supported services including Tella Web, Uwazi, ODK,
    Nextcloud, Google Drive and Dropbox.

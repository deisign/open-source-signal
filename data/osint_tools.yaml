  review_summary_en: Google Pinpoint is a research service designed for journalists working with large collections.
    It can search PDFs, scans, images, email archives and other documents, transcribe audio and video, identify
    people, organizations and locations for filtering, and extract similarly structured tables into sortable data.
    Collections are private by default and can be shared with collaborators.
  review_workflow_en: Keep an untouched source copy of every uploaded file with original filename, acquisition date
    and hash. Use labels and exact-search queries for investigative hypotheses, but cite the original page, document
    or timestamp rather than a generated entity list. Export or record important findings outside the platform so
    the research trail remains reproducible if indexing changes.

  archive_review: true
  review_summary_en: ReplayWeb.page is an open-source, browser-based viewer for static web archives. It can load
    and render WACZ, WARC, HAR and related archive formats, search archived pages and URLs, use full-text search
    where extracted text is present, and incrementally load large WACZ files. Local files can be opened directly
    in the browser without being uploaded elsewhere, while archived content can also be loaded from remote URLs
    or Google Drive and embedded in other sites.
  review_workflow_en: Preserve the original archive file and hash before review. Record archive format, capture
    tool, capture time, source URL and ReplayWeb.page version or access date. During review, distinguish content
    contained in the archive from resources that failed to capture. For sharing, prefer WACZ where appropriate because
    it is indexed for on-demand loading, and keep the original evidence file unchanged alongside any exported screenshots
    or notes.
  review_summary_uk: ReplayWeb.page — відкритий браузерний засіб для перегляду статичних вебархівів. Він відтворює
    WACZ, WARC, HAR та споріднені формати, дає змогу шукати сторінки й URL усередині архіву, використовувати повнотекстовий
    пошук за наявності витягнутого тексту та поступово завантажувати великі WACZ-файли. Локальні файли можна відкривати
    без надсилання на зовнішній сервер; також підтримуються віддалені посилання, Google Drive та вбудовування архівів
    у вебсторінки.
  review_workflow_uk: Перед переглядом збережіть первинний архівний файл і його контрольну суму. Фіксуйте формат
    архіву, засіб захоплення, час, початковий URL і версію ReplayWeb.page або дату перевірки. Під час аналізу відділяйте
    вміст, який справді є в архіві, від ресурсів, що не були захоплені. Для поширення за потреби віддавайте перевагу
    WACZ із готовим індексом для вибіркового завантаження, а початковий доказовий файл тримайте незмінним поруч
    зі знімками екрана чи нотатками.

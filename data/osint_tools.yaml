  review_summary_en: AgentCrawl 0.5.2 was released on PyPI on October 6. The project is a small self-hosted crawler
    that converts ordinary web pages and local documents into Markdown, text, links, metadata, JSON-LD and crawl
    results. It can run through CLI, Python, Docker/API or MCP and describes its design around local state and explicit
    failure modes rather than pretending every requested page was successfully extracted.

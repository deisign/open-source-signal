  review_summary_en: Ames Stereo Pipeline is NASA’s free and open-source suite for geodesy and stereogrammetry.
    The documentation says it processes images from satellites, rovers, aerial cameras, low-cost satellites and
    historical imagery, producing digital terrain models, ortho-projected images, 3D models and camera networks.
  review_workflow_en: 'Practical fields: does — stereo photogrammetry, terrain generation, orthoimage production
    and camera adjustment; use case — terrain-aware satellite analysis for damage, crater, fortification or infrastructure-change
    verification; input — suitable stereo/satellite/aerial imagery and camera metadata; output — DTM/DEM, point
    cloud, mesh, orthoimage; license/pricing — open-source software, imagery access may be paid/licensed separately;
    original source — NASA ASP docs and GitHub. Pair outputs with QGIS, source-image metadata and a written uncertainty
    note.'
  review_summary_uk: Ames Stereo Pipeline — безкоштовний open-source suite NASA для geodesy і stereogrammetry. Документація
    описує роботу із супутниковими знімками, rover imagery, aerial cameras, low-cost satellites та історичними зображеннями;
    на виході — digital terrain models, ortho-projected images, 3D models і camera networks.
  review_workflow_uk: 'Практичні поля: що робить — stereo photogrammetry, terrain generation, orthoimage production
    і camera adjustment; кейс — terrain-aware satellite analysis для перевірки руйнувань, воронок, укріплень або
    змін інфраструктури; input — придатні stereo/satellite/aerial imagery і camera metadata; output — DTM/DEM, point
    cloud, mesh, orthoimage; ліцензія/ціна — open-source software, imagery може бути платним або ліцензійним; першоджерело
    — NASA ASP docs і GitHub. Поєднуйте результати з QGIS, metadata знімків і окремою note про uncertainty.'

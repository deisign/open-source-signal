  review_summary_en: Browsertrix Crawler is a standalone, browser-based high-fidelity crawler designed to run customizable
    web-archive crawls in a Docker container. The GitHub release page lists v1.12.4 as the latest release, with
    fixes around collection crawl IDs, WACZ reference handling and seed URL hash handling.
  review_workflow_en: 'Practical fields: does — browser-based web crawling and WACZ/WARC-style preservation; use
    case — bounded public-source captures; input — seed URL or crawl configuration; output — crawl collection and
    WACZ archive; license/pricing — AGPL-3.0, free/open source; original source — Webrecorder GitHub and docs. Use
    specific release tags in production, define scope before crawling, save the crawl config, record operator/time/source
    list, hash the archive and keep raw captures separate from working copies.'
  review_summary_uk: Browsertrix Crawler — це автономний browser-based high-fidelity crawler для контрольованого
    вебархівування в Docker-контейнері. На GitHub останнім стабільним релізом позначено v1.12.4 із виправленнями
    щодо crawl IDs у колекціях, WACZ-посилань і seed URL із hash-фрагментами.
  review_workflow_uk: 'Практичні поля: що робить — browser-based crawl і WACZ/WARC-style збереження; кейс — контрольована
    фіксація відкритих вебджерел; input — seed URL або crawl config; output — crawl collection і WACZ-архів; ліцензія/ціна
    — AGPL-3.0, free/open source; першоджерело — Webrecorder GitHub і документація. У продакшені використовуйте
    конкретний release tag, задавайте scope до запуску, зберігайте config, фіксуйте оператора/час/список URL, хешуйте
    архів і відділяйте raw capture від робочих копій.'

  review_summary_en: Bellingcat documented a machine-learning workflow developed from its Ukraine civilian-harm
    monitoring. Researchers had collected and geolocated more than 2,500 incidents between February 2022 and September
    2025. For triage, they built a labelled collection of 5,848 verified positive Telegram URLs and 48,545 surrounding
    negative posts after exclusions, represented the posts with 893 numerical features, compared several models
    and selected XGBoost. The resulting interface ranked incoming posts by likelihood of containing civilian-harm
    material; a researcher still confirmed candidates before they moved to preservation and collaborative verification
    systems. Bellingcat describes the model as a work in progress.
  review_workflow_en: Define the positive class and exclusion rules before training. Preserve labelled examples,
    source and collection dates, deduplication rules, feature definitions, train/validation/test split, model version,
    threshold, precision and recall metrics, reviewer decisions and a sample of posts the model did not flag. Keep
    discovery, preservation, geolocation, victim-status assessment, weapons review and publication in separate queues.
    Retrain only with reviewed feedback and compare each new version against a fixed holdout set.
  review_summary_uk: Bellingcat описала методику машинного навчання, створену на основі спостереження за шкодою
    цивільним в Україні. Від лютого 2022 до вересня 2025 року дослідники зібрали й геолокували понад 2500 подій.
    Для первинного відбору вони сформували розмічену сукупність із 5848 перевірених посилань Telegram із позитивними
    випадками та 48 545 сусідніх повідомлень без таких випадків після очищення, подали записи через 893 числові
    ознаки, порівняли кілька моделей і обрали XGBoost. Інтерфейс упорядковував нові повідомлення за ймовірністю
    наявності матеріалу про шкоду цивільним; дослідник однаково мав підтвердити кандидата перед збереженням і спільною
    перевіркою. Bellingcat прямо називає модель незавершеною.
  review_workflow_uk: До навчання визначте позитивний клас і правила виключення. Зберігайте розмічені приклади,
    джерела й дати збирання, правила усунення повторів, опис ознак, поділ на навчальну, перевірну й підсумкову вибірки,
    версію моделі, поріг, показники точності та повноти, рішення перевіряльників і вибірку повідомлень, яких модель
    не позначила. Розділяйте черги пошуку, збереження, геолокації, встановлення статусу потерпілої людини, дослідження
    зброї та публікації. Повторно навчайте лише на перевіреному зворотному зв’язку й порівнюйте нову версію з незмінною
    контрольною вибіркою.

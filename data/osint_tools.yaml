  review_summary_en: Social Media Data Toolkit is a Python toolkit for ingesting, normalizing, enriching and analyzing
    social-media data. Its repository describes support for standardizing raw exports from platforms such as Twitter/X,
    Bluesky and Truth Social into normalized tables, with anonymization and redaction helpers before sharing datasets.
  review_workflow_en: Use it on lawful exports or approved research datasets only. Normalize copies, run redaction
    or pseudonymization before sharing, export analysis tables, and keep a separate access-controlled file that
    maps pseudonyms to original identifiers where retention is lawful and necessary.
  review_summary_uk: Social Media Data Toolkit — це Python-інструмент для завантаження, уніфікації, збагачення й
    аналізу даних із соціальних платформ. Репозиторій описує перетворення сирих експортів із Twitter/X, Bluesky
    і Truth Social у нормалізовані таблиці, а також допоміжні засоби для анонімізації й редагування перед передаванням
    наборів даних.
  review_workflow_uk: Використовуйте його лише для законних експортів або затверджених дослідницьких наборів даних.
    Уніфікуйте копії, застосовуйте редагування або псевдонімізацію перед передаванням, експортуйте аналітичні таблиці

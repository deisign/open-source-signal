  review_summary_en: Defence Intelligence of Ukraine published an interactive 3D model and component-production
    map for the Russian RM-48U strike missile. The War & Sanctions portal lists 114 identified electronic components,
    63 enterprises linked to production and 24 officials or employees of core production enterprises, alongside
    information on foreign equipment used by some of those enterprises. DIU says the RM-48U combines and adapts
    elements from missiles associated with the S-300 and S-400 families for ground-strike use.
  review_workflow_en: 'Use the public missile page as a structured lead source: record component marking, claimed
    manufacturer, subsystem, publication date and portal attribution, then corroborate corporate and sanctions status
    independently. Avoid republishing unnecessary personal details about listed employees.'
  review_summary_uk: ГУР МО України опублікувало інтерактивну 3D-модель і карту компонентів та виробничої кооперації
    російської ударної ракети РМ-48У. Портал War & Sanctions наводить 114 ідентифікованих електронних компонентів,
    63 підприємства, пов'язані з виробництвом, і 24 посадовців або працівників ключових підприємств кооперації,
    а також дані про іноземне обладнання, яке використовують окремі виробники. За версією ГУР, РМ-48У поєднує й
    адаптує елементи ракет сімейств С-300 та С-400 для ударів по наземних цілях.
  review_workflow_uk: 'Використовуйте публічну сторінку ракети як структуроване джерело зачіпок: фіксуйте маркування
    компонента, заявленого виробника, підсистему, дату публікації та атрибуцію порталу, а корпоративний і санкційний
    статус перевіряйте незалежно. Не дублюйте без потреби персональні дані перелічених працівників.'

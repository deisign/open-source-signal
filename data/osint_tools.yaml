  review_summary_en: Smart Image Sorter is a Bellingcat Python project for zero-shot image classification using
    open-source models from the Hugging Face ecosystem. It can batch-process an image collection, assign one of
    researcher-supplied labels, organise files into labelled folders and write classification results to CSV. It
    supports a command-line route and a Jupyter interface; Bellingcat also provides a Colab option. Because the
    classifier is zero-shot, researchers can define useful categories without first training a bespoke image model.
  review_workflow_en: Work on copies and hash the source collection first. Define mutually understandable labels
    and include an 'other' or review class so the model is not forced into a false substantive category. Record
    the model name and version, tool commit, labels, operation mode, batch size, run time and CSV output. Manually
    review all high-stakes categories and a random sample of every other category, calculate error rates, and preserve
    the original file path or identifier alongside every classification. For sensitive images, prefer local execution.
  review_summary_uk: Smart Image Sorter — проєкт Bellingcat на Python для класифікації зображень без попереднього
    навчання моделі на власному наборі прикладів, із використанням відкритих моделей екосистеми Hugging Face. Він
    може пакетно опрацювати колекцію, призначити одну з категорій, заданих дослідником, розкласти файли по відповідних
    теках і записати результати класифікації в CSV. Доступні запуск із командного рядка та інтерфейс Jupyter; Bellingcat
    також надає варіант у Colab. Дослідник може визначити потрібні категорії без окремого навчання власної моделі.
  review_workflow_uk: Працюйте з копіями, а первинний масив спочатку зафіксуйте контрольними сумами. Визначайте
    зрозумілі й взаємно відмінні категорії та додавайте категорію «інше» або «потребує перевірки», щоб модель не
    була змушена призначати хибний змістовний клас. Фіксуйте назву й версію моделі, стан сховища коду, перелік категорій,
    режим роботи, розмір пакета, час запуску та отриманий CSV. Вручну перевіряйте всі категорії з високими наслідками
    й випадкову вибірку з решти, рахуйте помилки та зберігайте первинний шлях або ідентифікатор файла поруч із кожною
    класифікацією. Для чутливих зображень віддавайте перевагу локальному запуску.

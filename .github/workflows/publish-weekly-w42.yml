name: Publish Weekly W42 Telegram

on:
  push:
    paths:
      - '.github/workflows/publish-weekly-w42.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Render weekly announcement
        run: python scripts/render_weekly_telegram.py weekly/open-source-signal-weekly-2026-W42.json --config site.json --out-dir telegram/weekly --max-items 7 --print-text
      - name: Check duplicate
        id: duplicate
        run: python telegram_sent_log.py check --sent-log data/telegram_sent.json --issue open-source-signal-weekly-2026-W42.json --lang uk --force false
      - name: Send announcement
        if: steps.duplicate.outputs.should_send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py --text-file telegram/weekly/open-source-signal-weekly-2026-W42.txt --disable-preview
      - name: Record send
        if: steps.duplicate.outputs.should_send == 'true'
        run: |
          python telegram_sent_log.py record --sent-log data/telegram_sent.json --issue open-source-signal-weekly-2026-W42.json --lang uk --issue-url https://osintsignal.org/weekly/open-source-signal-weekly-2026-W42.html --text-file telegram/weekly/open-source-signal-weekly-2026-W42.txt --run-id "${{ github.run_id }}" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_sent.json
          git commit -m "Record Weekly W42 Telegram announcement"
          git push

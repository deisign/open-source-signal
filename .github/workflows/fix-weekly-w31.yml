name: One-time fix Weekly W31

on:
  push:
    paths:
      - ".github/workflows/fix-weekly-w31.yml"

permissions:
  contents: write

jobs:
  fix-weekly-w31:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove internal editorial fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("weekly/open-source-signal-weekly-2026-W31.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          removed = 0
          data.pop("internal_notes", None)
          data.pop("internal_editorial_notes", None)
          for item in data.get("items", []):
              if "editorial_use" in item:
                  item.pop("editorial_use")
                  removed += 1
              item.pop("internal_notes", None)
              item.pop("internal_editorial_notes", None)

          if removed != 7:
              raise SystemExit(f"Expected to remove 7 editorial_use fields, removed {removed}")

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify public Weekly contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("weekly/open-source-signal-weekly-2026-W31.json").read_text(encoding="utf-8"))
          assert "internal_notes" not in data
          assert "internal_editorial_notes" not in data
          assert len(data.get("items", [])) == 7
          for item in data["items"]:
              assert "editorial_use" not in item
              assert "internal_notes" not in item
              assert "internal_editorial_notes" not in item
          PY

      - name: Commit corrected Weekly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/open-source-signal-weekly-2026-W31.json
          if git diff --cached --quiet; then
            echo "No correction needed"
            exit 0
          fi
          git commit -m "Remove internal editorial fields from Weekly W31"
          git push

name: Publish Weekly W43 Telegram announcement

on:
  push:
    paths: [".github/workflows/publish-w43.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build static site
        run: python build_site.py --issues issues --templates templates --out dist --config site.json

      - name: Render Telegram announcement
        id: render
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_URL="https://osintsignal.org/weekly/open-source-signal-weekly-2026-W43.html"
          TEXT_FILE="dist/weekly-w43-telegram.txt"
          cat > "$TEXT_FILE" <<'ANNOUNCEMENT'
          🛰 <b>Open Source Signal Weekly W43</b>
          <i>19–25 жовтня 2026 · недільний номер, опублікований 26 жовтня</i>
          
          Повернення 270 українців 23 жовтня завершує тиждень матеріалів про полон, репатріацію та зниклих. Сім розділів поєднують ці різні обліки з процесуальними змінами, уточненнями шкоди цивільним, прогалинами відкритих даних, інструментами архівування та ціною розголошення персональних відомостей.
          
          <b>У випуску:</b>
          • 270 людей повернулися: звільнення, репатріація й підтвердження — різні записи
          • Нова процесуальна дія потребує власного доказового сліду
          • Лозова: облік постраждалих має допускати подальші уточнення
          • Таблиця обміну описує саме групу звільнених
          • Числове розходження й застарілий набір потребують різних пояснень
          • Пошук, збереження й витягування мають залишати різні результати
          • Відкритий запис може створювати ризик для цивільного
          
          <a href="https://osintsignal.org/weekly/open-source-signal-weekly-2026-W43.html">Читати тижневий випуск</a>
          
          #OSINT #Ukraine #Verification #WarCrimes
          ANNOUNCEMENT

          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

          echo "Rendered $TEXT_FILE"
          cat "$TEXT_FILE"

      - name: Check duplicate Telegram announcement
        id: duplicate
        run: |
          python telegram_sent_log.py check \
            --sent-log data/telegram_sent.json \
            --issue "open-source-signal-weekly-2026-W43.json" \
            --lang "uk" \
            --force "false"

      - name: Send Telegram announcement
        if: steps.duplicate.outputs.should_send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram.py \
            --text-file "${{ steps.render.outputs.text_file }}" \
            --disable-preview

      - name: Record Telegram send
        if: steps.duplicate.outputs.should_send == 'true'
        run: |
          python telegram_sent_log.py record \
            --sent-log data/telegram_sent.json \
            --issue "open-source-signal-weekly-2026-W43.json" \
            --lang "uk" \
            --issue-url "${{ steps.render.outputs.issue_url }}" \
            --text-file "${{ steps.render.outputs.text_file }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit Telegram sent log
        if: steps.duplicate.outputs.should_send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/telegram_sent.json

          if git diff --cached --quiet; then
            echo "No sent-log changes to commit."
          else
            git commit -m "Record Telegram announcement for open-source-signal-weekly-2026-W43.json (uk)"
            git push
          fi

      - name: Skip duplicate notice
        if: steps.duplicate.outputs.should_send != 'true'
        run: |
          echo "Telegram announcement was already sent. Nothing posted. Use force=true to resend."
